<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191d24" />
    <!-- 路由级 description/keywords/og/twitter/canonical 与站点 JSON-LD
         由 src/shared/seo.mjs 单一派生:运行时走 src/utils/seo.ts,
         构建期走 scripts/static-html.mjs,本文件不再维护重复副本。 -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="192x192" />
    <title>蔚蓝咖啡厅</title>
    <!-- Google tag (gtag.js) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <link rel="preconnect" href="https://www.google-analytics.com" crossorigin />
    <script>
      // 两个站点分别使用独立数据流；本地开发和 www 跳转页不发送统计。
      ;(() => {
        const tagId = new Map([
          ['bluearchive.cafe', 'G-L9C6BQBHSG'],
          ['bluearchive-cafe.github.io', 'GT-MK5ZZ9QP']
        ]).get(window.location.hostname)
        if (!tagId) return

        window.dataLayer = window.dataLayer || []
        function gtag() { window.dataLayer.push(arguments) }
        window.gtag = gtag
        gtag('js', new Date())
        gtag('config', tagId)

        const script = document.createElement('script')
        script.async = true
        script.src = `https://www.googletagmanager.com/gtag/js?id=${tagId}`
        document.head.appendChild(script)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
